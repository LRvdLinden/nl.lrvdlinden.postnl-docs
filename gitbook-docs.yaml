$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: PostNL for Homey
  structure:
    - type: space
      key: postnl-nl
      title: Nederlands
      path: nl
      default: true
      content:
        directory: ./nl
        language: nl
    - type: space
      key: postnl-en
      title: English
      path: en
      content:
        directory: ./en
        language: en
